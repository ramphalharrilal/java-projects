name: Java compilation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    name: Compile standalone projects
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile every project
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' project; do
            output_directory="$(mktemp -d)"
            javac -d "$output_directory" "$project"
          done < <(find . -name '*.java' -print0)
